name: Windows-RDP-Fix
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Mengunduh Ngrok
      run: |
        Invoke-WebRequest https://equinox.io -OutFile ngrok.zip
        Expand-Archive ngrok.zip
    - name: Otentikasi Ngrok
      run: .\ngrok\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
    - name: Mengaktifkan Akses RDP Windows
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    - name: Membuat Akun User Baru
      run: |
        net user Administrator Password123 /add
        net localgroup Administrators Administrator /add
    - name: Memunculkan IP RDP & Menjalankan Tunnel
      run: |
        Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
        Start-Sleep -Seconds 10
        $NgrokUrl = (Invoke-RestMethod -Uri "http://127.0.0").tunnels.public_url
        Write-Host "=========================================="
        Write-Host "ALAMAT RDP ANDA: $NgrokUrl"
        Write-Host "USERNAME: Administrator"
        Write-Host "PASSWORD: Password123"
        Write-Host "=========================================="
    - name: Menjaga RDP Tetap Aktif
      run: |
        $loop = 360
        do {
          Write-Host "RDP Aktif... Sisa waktu: $loop menit"
          Start-Sleep -Seconds 60
          $loop--
        } while ($loop -gt 0)
